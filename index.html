<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Dashboard Académico</title>
    <meta name="description" content="Gestor y seguimiento de materias, actividades semanales y rendimiento académico sincronizado." />
    <meta property="og:title" content="Dashboard Académico" />
    <meta property="og:description" content="Gestor y seguimiento de materias, actividades semanales y rendimiento académico sincronizado." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('uees_theme_mode') || localStorage.getItem('academic_dashboard_theme_v1') || 'system';
          if (mode !== 'dark' && mode !== 'light' && mode !== 'system') mode = 'system';
          var isDark = false;
          if (mode === 'system') {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          } else {
            isDark = (mode === 'dark');
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }

          // Listener temprano para eventos nativos de Android
          window.addEventListener('androidThemeChange', function(e) {
            if (localStorage.getItem('uees_theme_mode') === 'system' || !localStorage.getItem('uees_theme_mode')) {
              var dark = e && e.detail && e.detail.isDark;
              if (typeof dark === 'boolean') {
                if (dark) {
                  document.documentElement.classList.add('dark');
                  document.documentElement.style.colorScheme = 'dark';
                } else {
                  document.documentElement.classList.remove('dark');
                  document.documentElement.style.colorScheme = 'light';
                }
              }
            }
          });
        } catch(e) {}
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dashboard" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
